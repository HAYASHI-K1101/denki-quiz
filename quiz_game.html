<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配電盤・制御盤クイズ / Trò chơi ôn thi</title>
<style>
  :root{
    --pink:#ff6fa5; --purple:#7b5cff; --blue:#4fc3f7; --green:#33d17a;
    --yellow:#ffd23f; --red:#ff5c5c; --dark:#2d2a4a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Segoe UI",sans-serif;
    background:linear-gradient(135deg,#ffe29f 0%,#ffa9c6 40%,#8ec5fc 100%);
    background-attachment:fixed;
    display:flex; justify-content:center; padding:24px 12px 60px;
    color:var(--dark);
  }
  .app{width:100%; max-width:720px;}
  .header{
    text-align:center; margin-bottom:18px;
  }
  .header h1{
    font-size:1.5rem; margin:0 0 4px; color:#fff;
    text-shadow:2px 2px 0 rgba(123,92,255,.6);
  }
  .header p{margin:2px 0; color:#4a3f7a; font-weight:bold;}
  .mascot{font-size:2.6rem; display:inline-block; animation:bounce 2s infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}

  .card{
    background:#fff; border-radius:24px; padding:22px 20px;
    box-shadow:0 12px 30px rgba(90,60,150,.25);
    position:relative; overflow:hidden;
  }

  /* Start screen */
  .start-screen{text-align:center;}
  .start-screen h2{color:var(--purple); font-size:1.3rem;}
  .cat-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0;
  }
  .cat-btn{
    border:none; border-radius:16px; padding:14px 8px; cursor:pointer;
    font-weight:bold; font-size:.95rem; color:#fff; text-align:left;
    box-shadow:0 4px 0 rgba(0,0,0,.15); transition:transform .1s;
    line-height:1.3;
  }
  .cat-btn small{display:block; font-weight:normal; opacity:.9; font-size:.75rem; margin-top:2px;}
  .cat-btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.15);}
  .cat-btn.all{grid-column:1/-1; background:linear-gradient(90deg,var(--purple),var(--pink)); font-size:1.05rem;}

  .big-start{
    margin-top:10px; background:linear-gradient(90deg,var(--green),#22b8cf);
    color:#fff; border:none; border-radius:20px; padding:16px 32px;
    font-size:1.2rem; font-weight:bold; cursor:pointer;
    box-shadow:0 6px 0 #1a8f5a;
  }
  .big-start:active{transform:translateY(4px); box-shadow:0 2px 0 #1a8f5a;}

  /* Progress */
  .progress-wrap{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .progress-bar{flex:1; height:14px; background:#eee; border-radius:8px; overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--pink),var(--purple)); width:0%; transition:width .4s ease;}
  .score-pill{
    background:var(--yellow); border-radius:20px; padding:4px 12px; font-weight:bold;
    white-space:nowrap; box-shadow:0 3px 0 #e0b400;
  }
  .streak{font-size:.85rem; color:#e85d04; font-weight:bold; text-align:right; min-height:18px;}

  .cat-tag{
    display:inline-block; background:var(--blue); color:#fff; font-size:.75rem;
    padding:3px 10px; border-radius:12px; font-weight:bold; margin-bottom:10px;
  }

  .question-jp{font-size:1.15rem; font-weight:bold; line-height:1.5; margin:6px 0 4px;}
  .question-vn{font-size:.95rem; color:#6a5acd; font-style:italic; margin-bottom:16px; line-height:1.4;}

  .choices{display:flex; flex-direction:column; gap:10px;}
  .choice-btn{
    text-align:left; border:2px solid #e5def7; background:#faf9ff; border-radius:14px;
    padding:12px 14px; font-size:1rem; cursor:pointer; transition:.15s;
    display:flex; gap:10px; align-items:flex-start;
  }
  .choice-btn .badge{
    flex:0 0 auto; width:26px; height:26px; border-radius:50%; background:var(--purple);
    color:#fff; display:flex; align-items:center; justify-content:center; font-size:.85rem; font-weight:bold;
  }
  .choice-btn .txt{display:flex; flex-direction:column;}
  .choice-btn .txt .vn{font-size:.8rem; color:#888; font-style:italic;}
  .choice-btn:hover{border-color:var(--purple); background:#f2eeff;}
  .choice-btn:disabled{cursor:default;}

  .ox-row{display:flex; gap:16px; justify-content:center; margin-top:10px;}
  .ox-btn{
    flex:1; max-width:150px; padding:26px 0; border-radius:20px; border:none; cursor:pointer;
    font-size:2.4rem; font-weight:bold; color:#fff; box-shadow:0 6px 0 rgba(0,0,0,.15);
  }
  .ox-btn.o{background:linear-gradient(180deg,#4fd18b,#20a562);}
  .ox-btn.x{background:linear-gradient(180deg,#ff8080,#e6483f);}
  .ox-btn:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.15);}
  .ox-btn:disabled{opacity:.5;}

  .choice-btn.correct, .ox-btn.correct{
    background:linear-gradient(180deg,#7bed9f,#2ed573)!important; border-color:#2ed573!important; color:#fff;
  }
  .choice-btn.wrong, .ox-btn.wrong{
    background:linear-gradient(180deg,#ff9a9a,#ff5c5c)!important; border-color:#ff5c5c!important; color:#fff;
  }

  .feedback{
    margin-top:18px; border-radius:16px; padding:16px; animation:pop .25s ease;
  }
  @keyframes pop{from{transform:scale(.9); opacity:0;} to{transform:scale(1); opacity:1;}}
  .feedback.correct{background:#e6fff2; border:2px solid #33d17a;}
  .feedback.wrong{background:#fff0f0; border:2px solid #ff5c5c;}
  .feedback .fb-title{font-weight:bold; font-size:1.1rem; margin-bottom:6px;}
  .feedback.correct .fb-title{color:#1a8f5a;}
  .feedback.wrong .fb-title{color:#c92a2a;}
  .feedback .exp-jp{font-size:.95rem; margin-bottom:4px; line-height:1.5;}
  .feedback .exp-vn{font-size:.88rem; color:#6a5acd; font-style:italic; line-height:1.5;}

  .next-btn{
    margin-top:16px; width:100%; padding:14px; border:none; border-radius:16px;
    background:linear-gradient(90deg,var(--purple),var(--pink)); color:#fff; font-size:1.05rem;
    font-weight:bold; cursor:pointer; box-shadow:0 5px 0 #5a3fc9;
  }
  .next-btn:active{transform:translateY(3px); box-shadow:0 2px 0 #5a3fc9;}

  /* Result screen */
  .result-screen{text-align:center;}
  .result-emoji{font-size:4rem; margin:6px 0;}
  .result-score{font-size:2.2rem; font-weight:bold; color:var(--purple); margin:6px 0;}
  .result-msg{font-size:1.1rem; font-weight:bold; margin:8px 0 4px; color:var(--dark);}
  .result-msg-vn{font-size:.95rem; color:#6a5acd; font-style:italic; margin-bottom:16px;}
  .stars{font-size:2rem; letter-spacing:6px; margin:10px 0;}
  .retry-btns{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:10px;}
  .retry-btns button{
    border:none; border-radius:16px; padding:12px 20px; font-weight:bold; cursor:pointer; color:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,.15); font-size:.95rem;
  }
  .retry-btns .again{background:linear-gradient(90deg,var(--green),#22b8cf);}
  .retry-btns .home{background:linear-gradient(90deg,var(--purple),var(--pink));}
  .retry-btns button:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.15);}

  .confetti{position:fixed; top:-20px; font-size:1.4rem; animation:fall linear forwards; pointer-events:none;}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg); opacity:.2;}}

  footer{text-align:center; color:#5a4d8a; font-size:.75rem; margin-top:18px;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="mascot">⚡🔧</div>
    <h1>配電盤・制御盤 学科試験クイズ</h1>
    <p>Trò chơi ôn thi lý thuyết - Lắp ráp tủ điện</p>
  </div>

  <div class="card" id="card"></div>
  <footer>技能実習評価試験（基礎級）電気機器組立て職種 学習用ゲーム ／ Trò chơi học tập, không phải đề thi chính thức</footer>
</div>

<script>
const QUESTIONS = [{"id": 1, "cat_jp": "1. 安全衛生", "cat_vn": "An toàn vệ sinh lao động", "type": "OX", "q_jp": "電気設備の作業を行うときは、必ず保護具（絶縁手袋・保護めがねなど）を着用しなければならない。", "q_vn": "Khi làm việc với thiết bị điện, bắt buộc phải mặc đồ bảo hộ (găng tay cách điện, kính bảo hộ, v.v.).", "answer": "○", "exp_jp": "感電や飛来物によるけがを防ぐため、作業に応じた保護具の着用は義務である。", "exp_vn": "Để phòng tránh điện giật và thương tích do vật bay, việc mặc đồ bảo hộ phù hợp là bắt buộc."}, {"id": 2, "cat_jp": "1. 安全衛生", "cat_vn": "An toàn vệ sinh lao động", "type": "OX", "q_jp": "作業開始前の安全装置の点検は、時間に余裕があるときだけ行えばよい。", "q_vn": "Việc kiểm tra thiết bị an toàn trước khi bắt đầu công việc chỉ cần thực hiện khi có thời gian rảnh.", "answer": "×", "exp_jp": "作業開始前点検は毎回必ず行う必要がある。省略してはならない。", "exp_vn": "Việc kiểm tra trước khi bắt đầu công việc phải được thực hiện mỗi lần, không được bỏ qua."}, {"id": 3, "cat_jp": "1. 安全衛生", "cat_vn": "An toàn vệ sinh lao động", "type": "4T", "q_jp": "感電事故が発生した場合、最初に行うべき行動として最も適切なものはどれか。", "q_vn": "Khi xảy ra tai nạn điện giật, hành động đúng đắn nhất cần thực hiện đầu tiên là gì?", "answer": "電源を遮断してから被災者を救助する", "exp_jp": "感電した人に素手で触れると救助者も感電する危険があるため、必ず電源を遮断してから対応する。", "exp_vn": "Nếu chạm tay không vào người bị điện giật, người cứu cũng có nguy cơ bị điện giật, vì vậy phải ngắt nguồn điện trước.", "choices": [{"jp": "すぐに被災者に素手で触れて助け出す", "vn": "Ngay lập tức dùng tay không chạm vào nạn nhân để cứu"}, {"jp": "電源を遮断してから被災者を救助する", "vn": "Ngắt nguồn điện trước, sau đó mới cứu nạn nhân"}, {"jp": "そのまま様子を見る", "vn": "Cứ đứng nhìn, không làm gì"}, {"jp": "大声で笑って周囲に知らせる", "vn": "Hét lớn cho vui để báo cho mọi người"}]}, {"id": 4, "cat_jp": "1. 安全衛生", "cat_vn": "An toàn vệ sinh lao động", "type": "OX", "q_jp": "整理整頓（5S）は、作業の安全性や効率とは関係がない。", "q_vn": "Việc sắp xếp gọn gàng nơi làm việc (5S) không liên quan đến an toàn và hiệu suất công việc.", "answer": "×", "exp_jp": "整理整頓は、つまずきや工具の紛失、感電などの事故防止につながり、安全と効率の両方に重要である。", "exp_vn": "Sắp xếp gọn gàng giúp phòng tránh vấp ngã, mất dụng cụ, điện giật, rất quan trọng cho cả an toàn và hiệu suất."}, {"id": 5, "cat_jp": "1. 安全衛生", "cat_vn": "An toàn vệ sinh lao động", "type": "4T", "q_jp": "労働災害を防止するために、作業前に行うべきこととして誤っているものはどれか。", "q_vn": "Điều nào sau đây là SAI khi nói về việc cần làm trước khi làm việc để phòng ngừa tai nạn lao động?", "answer": "危険を感じても作業を続ける", "exp_jp": "危険を感じたら直ちに作業を中止し、責任者に報告することが基本である。", "exp_vn": "Khi cảm thấy nguy hiểm, phải dừng ngay công việc và báo cáo cho người phụ trách.", "choices": [{"jp": "作業手順を確認する", "vn": "Xác nhận quy trình làm việc"}, {"jp": "保護具を点検し正しく着用する", "vn": "Kiểm tra và mặc đúng đồ bảo hộ"}, {"jp": "周囲の安全を確認する", "vn": "Kiểm tra an toàn xung quanh"}, {"jp": "危険を感じても作業を続ける", "vn": "Dù cảm thấy nguy hiểm vẫn tiếp tục làm việc"}]}, {"id": 6, "cat_jp": "1. 安全衛生", "cat_vn": "An toàn vệ sinh lao động", "type": "OX", "q_jp": "電動工具を使用する際は、使用前にコードの損傷の有無を確認する必要がある。", "q_vn": "Khi sử dụng dụng cụ điện cầm tay, cần kiểm tra dây điện có bị hỏng hay không trước khi sử dụng.", "answer": "○", "exp_jp": "コードの損傷は感電や漏電火災の原因となるため、使用前点検は必須である。", "exp_vn": "Dây điện bị hỏng có thể gây điện giật hoặc cháy do rò điện, nên việc kiểm tra trước khi dùng là bắt buộc."}, {"id": 7, "cat_jp": "1. 安全衛生", "cat_vn": "An toàn vệ sinh lao động", "type": "4T", "q_jp": "労働安全衛生法の目的として最も適切なものはどれか。", "q_vn": "Mục đích của Luật An toàn Vệ sinh Lao động là gì?", "answer": "労働者の安全と健康を確保すること", "exp_jp": "労働安全衛生法は職場における労働者の安全と健康を確保することを目的とする法律である。", "exp_vn": "Luật An toàn Vệ sinh Lao động nhằm mục đích đảm bảo an toàn và sức khỏe cho người lao động tại nơi làm việc.", "choices": [{"jp": "会社の利益を最大化すること", "vn": "Tối đa hóa lợi nhuận công ty"}, {"jp": "労働者の安全と健康を確保すること", "vn": "Đảm bảo an toàn và sức khỏe cho người lao động"}, {"jp": "労働時間を延長すること", "vn": "Kéo dài thời gian làm việc"}, {"jp": "製品の生産量を増やすこと", "vn": "Tăng sản lượng sản phẩm"}]}, {"id": 8, "cat_jp": "2. 工具・器具", "cat_vn": "Dụng cụ, đồ nghề", "type": "OX", "q_jp": "ドライバーは、ねじの頭の大きさや溝の形状に合ったものを選んで使用する。", "q_vn": "Tua vít phải được chọn phù hợp với kích thước và hình dạng rãnh của đầu vít.", "answer": "○", "exp_jp": "合わないドライバーを使うと、ねじやドライバーを傷める原因となる。", "exp_vn": "Nếu dùng tua vít không phù hợp sẽ làm hỏng vít hoặc tua vít."}, {"id": 9, "cat_jp": "2. 工具・器具", "cat_vn": "Dụng cụ, đồ nghề", "type": "4T", "q_jp": "電線の被覆をむくために使用する工具はどれか。", "q_vn": "Dụng cụ nào được dùng để tuốt vỏ bọc dây điện?", "answer": "ワイヤストリッパ", "exp_jp": "ワイヤストリッパは電線の被覆を一定の長さでむくための専用工具である。", "exp_vn": "Kìm tuốt dây (wire stripper) là dụng cụ chuyên dùng để tuốt vỏ bọc dây điện với độ dài nhất định.", "choices": [{"jp": "スパナ", "vn": "Cờ lê"}, {"jp": "ワイヤストリッパ", "vn": "Kìm tuốt dây"}, {"jp": "ノギス", "vn": "Thước cặp"}, {"jp": "トルクレンチ", "vn": "Cờ lê lực"}]}, {"id": 10, "cat_jp": "2. 工具・器具", "cat_vn": "Dụng cụ, đồ nghề", "type": "OX", "q_jp": "トルクレンチは、ねじを規定の締め付けトルクで締めるために使用する。", "q_vn": "Cờ lê lực (torque wrench) được dùng để siết vít với lực siết theo quy định.", "answer": "○", "exp_jp": "規定トルクを超えて締めると部品破損、不足すると緩みの原因になる。", "exp_vn": "Nếu siết quá lực quy định sẽ làm hỏng linh kiện, nếu siết thiếu sẽ gây lỏng."}, {"id": 11, "cat_jp": "2. 工具・器具", "cat_vn": "Dụng cụ, đồ nghề", "type": "4T", "q_jp": "端子に電線を接続する際、電線の端に圧着端子を取り付けるために使用する工具はどれか。", "q_vn": "Dụng cụ nào dùng để bấm đầu cốt (đầu nối ép) vào đầu dây điện khi đấu nối vào cực đấu dây?", "answer": "圧着工具（圧着ペンチ）", "exp_jp": "圧着工具は電線と圧着端子をかしめて確実に接続するための工具である。", "exp_vn": "Kìm bấm cốt dùng để ép chặt đầu cốt vào dây điện, đảm bảo kết nối chắc chắn.", "choices": [{"jp": "圧着工具（圧着ペンチ）", "vn": "Kìm bấm cốt"}, {"jp": "ハンマ", "vn": "Búa"}, {"jp": "けがき針", "vn": "Kim vạch dấu"}, {"jp": "リーマ", "vn": "Dao doa lỗ"}]}, {"id": 12, "cat_jp": "2. 工具・器具", "cat_vn": "Dụng cụ, đồ nghề", "type": "OX", "q_jp": "モンキレンチは、対象の大きさに合わせて口の幅を調整できる工具である。", "q_vn": "Mỏ lết (monkey wrench) là dụng cụ có thể điều chỉnh độ rộng miệng theo kích thước vật cần siết.", "answer": "○", "exp_jp": "モンキレンチはアジャスタで口の開きを調整できるため、様々なサイズのボルト・ナットに対応できる。", "exp_vn": "Mỏ lết có thể điều chỉnh độ mở miệng bằng vít điều chỉnh, phù hợp với nhiều kích cỡ bu lông, đai ốc khác     const vn = QUESTIONS.find(q=>q.cat_jp===c).cat_vn;
    const color = CAT_COLORS[i % CAT_COLORS.length];
    return `<button class="cat-btn" style="background:${color}" data-cat="${c}">${c}<small>${vn}</small></button>`;
  }).join("");

  card.innerHTML = `
    <div class="start-screen">
      <h2>🎮 挑戦する分野を選ぼう！</h2>
      <p style="color:#6a5acd; font-style:italic; margin-top:-6px;">Chọn chủ đề bạn muốn thử thách!</p>
      <div class="cat-grid">
        <button class="cat-btn all" data-cat="ALL">🌟 全部まとめて挑戦！<small>Thử thách tất cả!</small></button>
        ${catButtons}
      </div>
    </div>
  `;
  card.querySelectorAll(".cat-btn").forEach(btn=>{
    btn.onclick = () => startQuiz(btn.dataset.cat);
  });
}

function startQuiz(cat){
  const list = cat === "ALL" ? QUESTIONS : QUESTIONS.filter(q=>q.cat_jp===cat);
  state.pool = shuffle(list);
  state.idx = 0;
  state.score = 0;
  state.streak = 0;
  state.bestStreak = 0;
  state.catLabel = cat === "ALL" ? "全分野 / Tất cả chủ đề" : cat;
  renderQuestion();
}

function renderProgress(){
  const total = state.pool.length;
  const pct = Math.round((state.idx/total)*100);
  return `
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="score-pill">⭐ ${state.score} / ${total}</div>
    </div>
    <div class="streak">${state.streak>=2 ? "🔥 "+state.streak+" 連続正解！ Chuỗi đúng "+state.streak+" câu!" : ""}</div>
  `;
}

function renderQuestion(){
  const card = document.getElementById("card");
  const q = state.pool[state.idx];
  state.answered = false;

  let body = "";
  if(q.type === "OX"){
    body = `
      <div class="ox-row">
        <button class="ox-btn o" data-val="○">○</button>
        <button class="ox-btn x" data-val="×">×</button>
      </div>
    `;
  } else {
    const labels = ["A","B","C","D"];
    body = `<div class="choices">` + q.choices.map((c,i)=>`
      <button class="choice-btn" data-val="${c.jp.replace(/"/g,'&quot;')}">
        <span class="badge">${labels[i]}</span>
        <span class="txt"><span class="jp">${c.jp}</span><span class="vn">${c.vn}</span></span>
      </button>
    `).join("") + `</div>`;
  }

  card.innerHTML = `
    ${renderProgress()}
    <div class="cat-tag">${q.cat_jp}</div>
    <div class="question-jp">Q${state.idx+1}. ${q.q_jp}</div>
    <div class="question-vn">${q.q_vn}</div>
    ${body}
    <div id="feedback-area"></div>
  `;

  const btns = card.querySelectorAll(".ox-btn, .choice-btn");
  btns.forEach(b => b.onclick = () => handleAnswer(b, q, btns));
}

function handleAnswer(btn, q, allBtns){
  if(state.answered) return;
  state.answered = true;
  const chosen = btn.dataset.val;
  const isCorrect = chosen === q.answer;

  allBtns.forEach(b=>{
    b.disabled = true;
    if(b.dataset.val === q.answer) b.classList.add("correct");
    else if(b === btn) b.classList.add("wrong");
  });

  if(isCorrect){
    state.score++;
    state.streak++;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    launchConfetti();
  } else {
    state.streak = 0;
  }

  const fbBox = document.getElementById("feedback-area");
  const praises = ["すごい！🎉","やった！✨","正解だよ！👏","さすが！💪","ナイス！🌟"];
  const encourages = ["だいじょうぶ！次はできるよ😊","おしい！💡","気にしないで、続けよう！🙌","一緒に頑張ろう！🌈"];
  const title = isCorrect
    ? praises[Math.floor(Math.random()*praises.length)] + " 正解 / Chính xác!"
    : encourages[Math.floor(Math.random()*encourages.length)] + " 不正解 / Chưa đúng";

  fbBox.innerHTML = `
    <div class="feedback ${isCorrect?'correct':'wrong'}">
      <div class="fb-title">${title}</div>
      <div class="exp-jp">📘 ${q.exp_jp}</div>
      <div class="exp-vn">📗 ${q.exp_vn}</div>
    </div>
    <button class="next-btn" id="nextBtn">${state.idx+1 < state.pool.length ? "次の問題へ ▶ Câu tiếp theo" : "結果を見る 🏆 Xem kết quả"}</button>
  `;
  document.getElementById("nextBtn").onclick = () => {
    state.idx++;
    if(state.idx < state.pool.length) renderQuestion();
    else renderResult();
  };
}

function renderResult(){
  const total = state.pool.length;
  const pct = Math.round((state.score/total)*100);
  let emoji, msgJp, msgVn, stars;
  if(pct === 100){
    emoji="🏆👑"; msgJp="満点！すばらしい！本当の合格レベルです！"; msgVn="Điểm tuyệt đối! Tuyệt vời! Bạn đã đạt trình độ đậu thật sự!"; stars="★★★★★";
  } else if(pct >= 80){
    emoji="🎉🌟"; msgJp="とてもよくできました！この調子で頑張ろう！"; msgVn="Làm rất tốt! Hãy tiếp tục cố gắng như vậy!"; stars="★★★★☆";
  } else if(pct >= 60){
    emoji="😊👍"; msgJp="いい感じ！もう少し復習すればバッチリ！"; msgVn="Khá tốt! Ôn thêm một chút nữa là hoàn hảo!"; stars="★★★☆☆";
  } else if(pct >= 40){
    emoji="💪🙂"; msgJp="よく挑戦したね！もう一度やってみよう！"; msgVn="Bạn đã cố gắng rồi! Hãy thử lại lần nữa nhé!"; stars="★★☆☆☆";
  } else {
    emoji="🌱😉"; msgJp="だいじょうぶ！練習すればきっとできる！"; msgVn="Không sao cả! Luyện tập nhiều sẽ làm được thôi!"; stars="★☆☆☆☆";
  }

  const card = document.getElementById("card");
  card.innerHTML = `
    <div class="result-screen">
      <div class="cat-tag">${state.catLabel}</div>
      <div class="result-emoji">${emoji}</div>
      <div class="result-score">${state.score} / ${total} 問正解 (${pct}%)</div>
      <div class="stars">${stars}</div>
      <div class="result-msg">${msgJp}</div>
      <div class="result-msg-vn">${msgVn}</div>
      <div style="margin-top:6px; color:#e85d04; font-weight:bold;">🔥 最高連続正解 / Chuỗi đúng liên tiếp cao nhất: ${state.bestStreak}</div>
      <div class="retry-btns">
        <button class="again" id="retryBtn">🔁 もう一度 / Làm lại</button>
        <button class="home" id="homeBtn">🏠 分野選択に戻る / Về chọn chủ đề</button>
      </div>
    </div>
  `;
  document.getElementById("retryBtn").onclick = () => {
    const cat = state.catLabel.startsWith("全分野") ? "ALL" : state.catLabel;
    startQuiz(cat);
  };
  document.getElementById("homeBtn").onclick = renderStart;

  if(pct >= 60) launchConfetti(30);
}

function launchConfetti(n){
  n = n || 8;
  const emojis = ["🎉","✨","⭐","🎊","💫"];
  for(let i=0;i<n;i++){
    const el = document.createElement("div");
    el.className = "confetti";
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left = Math.random()*100 + "vw";
    el.style.animationDuration = (2 + Math.random()*1.5) + "s";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 4000);
  }
}

renderStart();
</script>
</body>
</html>
