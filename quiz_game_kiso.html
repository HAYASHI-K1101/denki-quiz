<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配電盤・制御盤クイズ（基礎級○×形式）/ Trò chơi ôn thi</title>
<style>
  :root{
    --pink:#ff6fa5; --purple:#7b5cff; --blue:#4fc3f7; --green:#33d17a;
    --yellow:#ffd23f; --red:#ff5c5c; --dark:#2d2a4a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Segoe UI",sans-serif;
    background:linear-gradient(135deg,#ffe29f 0%,#ffa9c6 40%,#8ec5fc 100%);
    background-attachment:fixed;
    display:flex; justify-content:center; padding:24px 12px 60px;
    color:var(--dark);
  }
  .app{width:100%; max-width:720px;}
  .header{text-align:center; margin-bottom:18px;}
  .header h1{font-size:1.4rem; margin:0 0 4px; color:#fff; text-shadow:2px 2px 0 rgba(123,92,255,.6);}
  .header p{margin:2px 0; color:#4a3f7a; font-weight:bold;}
  .mascot{font-size:2.6rem; display:inline-block; animation:bounce 2s infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}

  .card{background:#fff; border-radius:24px; padding:22px 20px; box-shadow:0 12px 30px rgba(90,60,150,.25); position:relative; overflow:hidden;}

  .start-screen{text-align:center;}
  .start-screen h2{color:var(--purple); font-size:1.3rem;}
  .field-group{text-align:left; margin:16px 0;}
  .field-group label{display:block; font-weight:bold; margin-bottom:6px; color:var(--dark);}
  .field-group input{
    width:100%; padding:12px 14px; border-radius:12px; border:2px solid #e5def7;
    font-size:1rem; font-family:inherit;
  }
  .field-group input:focus{outline:none; border-color:var(--purple);}
  .company-fixed{
    background:#f2eeff; border-radius:12px; padding:10px 14px; font-weight:bold; color:var(--purple);
  }

  .cat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0;}
  .cat-btn{
    border:none; border-radius:16px; padding:14px 8px; cursor:pointer;
    font-weight:bold; font-size:.95rem; color:#fff; text-align:left;
    box-shadow:0 4px 0 rgba(0,0,0,.15); transition:transform .1s; line-height:1.3;
  }
  .cat-btn small{display:block; font-weight:normal; opacity:.9; font-size:.75rem; margin-top:2px;}
  .cat-btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.15);}
  .cat-btn.all{grid-column:1/-1; background:linear-gradient(90deg,var(--purple),var(--pink)); font-size:1.05rem;}
  .cat-btn:disabled{opacity:.4; cursor:not-allowed;}

  .hint{font-size:.85rem; color:#c92a2a; font-weight:bold; min-height:20px; margin-top:4px;}

  .progress-wrap{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .progress-bar{flex:1; height:14px; background:#eee; border-radius:8px; overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--pink),var(--purple)); width:0%; transition:width .4s ease;}
  .score-pill{background:var(--yellow); border-radius:20px; padding:4px 12px; font-weight:bold; white-space:nowrap; box-shadow:0 3px 0 #e0b400;}
  .streak{font-size:.85rem; color:#e85d04; font-weight:bold; text-align:right; min-height:18px;}

  .cat-tag{display:inline-block; background:var(--blue); color:#fff; font-size:.75rem; padding:3px 10px; border-radius:12px; font-weight:bold; margin-bottom:10px;}

  .question-jp{font-size:1.15rem; font-weight:bold; line-height:1.5; margin:6px 0 4px;}
  .question-vn{font-size:.95rem; color:#6a5acd; font-style:italic; margin-bottom:16px; line-height:1.4;}

  .choices{display:flex; flex-direction:column; gap:10px;}
  .choice-btn{
    text-align:left; border:2px solid #e5def7; background:#faf9ff; border-radius:14px;
    padding:12px 14px; font-size:1rem; cursor:pointer; transition:.15s; display:flex; gap:10px; align-items:flex-start;
  }
  .choice-btn .badge{flex:0 0 auto; width:26px; height:26px; border-radius:50%; background:var(--purple); color:#fff; display:flex; align-items:center; justify-content:center; font-size:.85rem; font-weight:bold;}
  .choice-btn .txt{display:flex; flex-direction:column;}
  .choice-btn .txt .vn{font-size:.8rem; color:#888; font-style:italic;}
  .choice-btn:hover{border-color:var(--purple); background:#f2eeff;}
  .choice-btn:disabled{cursor:default;}

  .ox-row{display:flex; gap:16px; justify-content:center; margin-top:10px;}
  .ox-btn{flex:1; max-width:150px; padding:26px 0; border-radius:20px; border:none; cursor:pointer; font-size:2.4rem; font-weight:bold; color:#fff; box-shadow:0 6px 0 rgba(0,0,0,.15);}
  .ox-btn.o{background:linear-gradient(180deg,#4fd18b,#20a562);}
  .ox-btn.x{background:linear-gradient(180deg,#ff8080,#e6483f);}
  .ox-btn:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.15);}
  .ox-btn:disabled{opacity:.5;}

  .choice-btn.correct, .ox-btn.correct{background:linear-gradient(180deg,#7bed9f,#2ed573)!important; border-color:#2ed573!important; color:#fff;}
  .choice-btn.wrong, .ox-btn.wrong{background:linear-gradient(180deg,#ff9a9a,#ff5c5c)!important; border-color:#ff5c5c!important; color:#fff;}

  .feedback{margin-top:18px; border-radius:16px; padding:16px; animation:pop .25s ease;}
  @keyframes pop{from{transform:scale(.9); opacity:0;} to{transform:scale(1); opacity:1;}}
  .feedback.correct{background:#e6fff2; border:2px solid #33d17a;}
  .feedback.wrong{background:#fff0f0; border:2px solid #ff5c5c;}
  .feedback .fb-title{font-weight:bold; font-size:1.1rem; margin-bottom:6px;}
  .feedback.correct .fb-title{color:#1a8f5a;}
  .feedback.wrong .fb-title{color:#c92a2a;}
  .feedback .exp-jp{font-size:.95rem; margin-bottom:4px; line-height:1.5;}
  .feedback .exp-vn{font-size:.88rem; color:#6a5acd; font-style:italic; line-height:1.5;}

  .next-btn{margin-top:16px; width:100%; padding:14px; border:none; border-radius:16px; background:linear-gradient(90deg,var(--purple),var(--pink)); color:#fff; font-size:1.05rem; font-weight:bold; cursor:pointer; box-shadow:0 5px 0 #5a3fc9;}
  .next-btn:active{transform:translateY(3px); box-shadow:0 2px 0 #5a3fc9;}

  .result-screen{text-align:center;}
  .result-emoji{font-size:4rem; margin:6px 0;}
  .result-score{font-size:2.2rem; font-weight:bold; color:var(--purple); margin:6px 0;}
  .result-msg{font-size:1.1rem; font-weight:bold; margin:8px 0 4px; color:var(--dark);}
  .result-msg-vn{font-size:.95rem; color:#6a5acd; font-style:italic; margin-bottom:16px;}
  .stars{font-size:2rem; letter-spacing:6px; margin:10px 0;}
  .retry-btns{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:10px;}
  .retry-btns button{border:none; border-radius:16px; padding:12px 20px; font-weight:bold; cursor:pointer; color:#fff; box-shadow:0 4px 0 rgba(0,0,0,.15); font-size:.95rem;}
  .retry-btns .again{background:linear-gradient(90deg,var(--green),#22b8cf);}
  .retry-btns .home{background:linear-gradient(90deg,var(--purple),var(--pink));}
  .retry-btns button:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.15);}

  .save-status{font-size:.8rem; margin-top:14px; color:#888;}
  .save-status.ok{color:#1a8f5a; font-weight:bold;}

  .confetti{position:fixed; top:-20px; font-size:1.4rem; animation:fall linear forwards; pointer-events:none;}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg); opacity:.2;}}

  .badge-note{font-size:.75rem; color:#6a5acd; background:#f2eeff; border-radius:10px; padding:6px 10px; margin-top:10px; display:inline-block;}

  footer{text-align:center; color:#5a4d8a; font-size:.75rem; margin-top:18px;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="mascot">⚡🔧</div>
    <h1>配電盤・制御盤 学科試験クイズ（基礎級・○×形式）</h1>
    <p>Trò chơi ôn thi lý thuyết - Dạng Đúng/Sai theo đề thi thực tế</p>
  </div>

  <div class="card" id="card"></div>
  <footer>技能実習評価試験（基礎級）電気機器組立て職種 学習用オリジナル問題 ／ Bộ câu hỏi tự soạn để luyện tập, không phải đề thi chính thức</footer>
</div>

<script>
const QUESTIONS = [
{"id": 1, "cat_jp": "1. 電気の基礎", "cat_vn": "Kiến thức cơ bản về điện", "type": "OX", "q_jp": "直流電動機の界磁コイルは、磁界をつくるための巻線である。", "q_vn": "Cuộn dây từ trường (field coil) của động cơ điện một chiều là cuộn dây dùng để tạo ra từ trường.", "answer": "○", "exp_jp": "界磁コイルは固定子側にあり、電流を流すことで磁界を発生させる役割を持つ。", "exp_vn": "Cuộn dây từ trường nằm ở phía stator (phần tĩnh), có vai trò tạo ra từ trường khi có dòng điện chạy qua."},
{"id": 2, "cat_jp": "1. 電気の基礎", "cat_vn": "Kiến thức cơ bản về điện", "type": "OX", "q_jp": "誘導電動機は、一般に交流電源に接続して使用する。", "q_vn": "Động cơ không đồng bộ (cảm ứng) thường được sử dụng bằng cách nối với nguồn điện xoay chiều.", "answer": "○", "exp_jp": "誘導電動機は交流による回転磁界を利用して回転する仕組みのため、交流電源で使用する。", "exp_vn": "Động cơ cảm ứng hoạt động dựa trên từ trường quay sinh ra từ dòng điện xoay chiều, nên được dùng với nguồn điện xoay chiều."},
{"id": 3, "cat_jp": "1. 電気の基礎", "cat_vn": "Kiến thức cơ bản về điện", "type": "OX", "q_jp": "コンデンサは、直流電圧を加えて十分に充電された後は、電流をほとんど流さなくなる。", "q_vn": "Tụ điện, sau khi được nạp đầy bằng điện áp một chiều, sẽ gần như không cho dòng điện đi qua nữa.", "answer": "○", "exp_jp": "コンデンサは直流に対しては充電完了後に電流を遮断する性質を持ち、交流に対しては電流を通す性質を持つ。", "exp_vn": "Tụ điện có tính chất chặn dòng điện một chiều sau khi nạp đầy, nhưng lại cho dòng điện xoay chiều đi qua."},
{"id": 4, "cat_jp": "1. 電気の基礎", "cat_vn": "Kiến thức cơ bản về điện", "type": "OX", "q_jp": "一定の電圧が加わっている回路で抵抗の値を大きくすると、流れる電流は小さくなる。", "q_vn": "Trong mạch có điện áp không đổi, nếu tăng giá trị điện trở thì dòng điện chạy qua sẽ giảm.", "answer": "○", "exp_jp": "オームの法則（I=V/R）より、電圧が一定であれば抵抗が大きいほど電流は小さくなる。", "exp_vn": "Theo định luật Ohm (I=V/R), nếu điện áp không đổi thì điện trở càng lớn, dòng điện càng nhỏ."},
{"id": 5, "cat_jp": "1. 電気の基礎", "cat_vn": "Kiến thức cơ bản về điện", "type": "OX", "q_jp": "抵抗を直列に接続すると、回路全体の合成抵抗は各抵抗の値の和になる。", "q_vn": "Khi mắc nối tiếp các điện trở, điện trở tổng của toàn mạch bằng tổng các giá trị điện trở thành phần.", "answer": "○", "exp_jp": "直列接続の合成抵抗はR1+R2+…のように単純な足し算で求められる。", "exp_vn": "Điện trở tổng khi mắc nối tiếp được tính đơn giản bằng R1+R2+…"},
{"id": 6, "cat_jp": "1. 電気の基礎", "cat_vn": "Kiến thức cơ bản về điện", "type": "OX", "q_jp": "コイルに流れる電流の向きを逆にしても、コイルの周りにできる磁界の向きは変わらない。", "q_vn": "Ngay cả khi đảo chiều dòng điện chạy trong cuộn dây, chiều từ trường sinh ra quanh cuộn dây cũng không thay đổi.", "answer": "×", "exp_jp": "電流の向きを変えると、右手の法則により磁界の向きも逆になる。", "exp_vn": "Khi đảo chiều dòng điện, theo quy tắc bàn tay phải, chiều từ trường cũng sẽ đảo ngược."},
{"id": 7, "cat_jp": "1. 電気の基礎", "cat_vn": "Kiến thức cơ bản về điện", "type": "OX", "q_jp": "電力[W]は、電圧[V]と電流[A]の積によって求めることができる。", "q_vn": "Công suất điện [W] có thể tính bằng tích của điện áp [V] và dòng điện [A].", "answer": "○", "exp_jp": "P=VIの式で表され、電力を求める基本的な計算式である。", "exp_vn": "Được biểu diễn bằng công thức P=VI, đây là công thức cơ bản để tính công suất điện."},
{"id": 8, "cat_jp": "1. 電気の基礎", "cat_vn": "Kiến thức cơ bản về điện", "type": "OX", "q_jp": "交流の周波数とは、1秒間に繰り返される波形（サイクル）の数のことである。", "q_vn": "Tần số của dòng điện xoay chiều là số lần dạng sóng (chu kỳ) lặp lại trong 1 giây.", "answer": "○", "exp_jp": "周波数の単位はHz（ヘルツ）で表され、日本では主に50Hzまたは60Hzが使われている。", "exp_vn": "Đơn vị của tần số là Hz (Hertz), tại Nhật Bản chủ yếu sử dụng tần số 50Hz hoặc 60Hz."},
{"id": 9, "cat_jp": "1. 電気の基礎", "cat_vn": "Kiến thức cơ bản về điện", "type": "OX", "q_jp": "電流計は、電流を測定したい回路に対して並列に接続して使用する。", "q_vn": "Ampe kế được sử dụng bằng cách mắc song song với mạch cần đo dòng điện.", "answer": "×", "exp_jp": "電流計は回路に対して直列に接続して使用する。並列に接続すると大電流が流れ、機器の破損や事故につながる危険がある。", "exp_vn": "Ampe kế phải được mắc nối tiếp với mạch điện. Nếu mắc song song, dòng điện lớn sẽ chạy qua, có thể làm hỏng thiết bị hoặc gây sự cố."},
{"id": 10, "cat_jp": "1. 電気の基礎", "cat_vn": "Kiến thức cơ bản về điện", "type": "OX", "q_jp": "電圧計は、電圧を測定したい部分に対して並列に接続して使用する。", "q_vn": "Vôn kế được sử dụng bằng cách mắc song song với phần cần đo điện áp.", "answer": "○", "exp_jp": "電圧計は測定したい箇所に対して並列に接続する。直列に接続すると正しく測定できない。", "exp_vn": "Vôn kế được mắc song song với phần cần đo. Nếu mắc nối tiếp sẽ không đo được chính xác."},
{"id": 11, "cat_jp": "2. 工具・器具", "cat_vn": "Dụng cụ, đồ nghề", "type": "OX", "q_jp": "ラチェット式の圧着工具は、圧着が完了するまでハンドルを開くことができない構造になっている。", "q_vn": "Kìm bấm cốt kiểu cóc (ratchet) có cấu tạo không thể mở tay cầm cho đến khi hoàn tất việc ép.", "answer": "○", "exp_jp": "圧着が不完全なまま外れてしまうことを防ぐための安全機構である。", "exp_vn": "Đây là cơ chế an toàn nhằm ngăn việc tháo ra khi chưa ép xong hoàn toàn."},
{"id": 12, "cat_jp": "2. 工具・器具", "cat_vn": "Dụng cụ, đồ nghề", "type": "OX", "q_jp": "ノギスは、一般に0.05mm程度の精度で寸法を測定できる工具である。", "q_vn": "Thước cặp (nogisu) thường là dụng cụ có thể đo kích thước với độ chính xác khoảng 0.05mm.", "answer": "○", "exp_jp": "ノギスは主尺と副尺（バーニヤ）を用いて0.05mm単位まで読み取れる。0.01mm単位の測定にはマイクロメータを用いる。", "exp_vn": "Thước cặp dùng thước chính và thước phụ (vernier) để đọc đến đơn vị 0.05mm. Để đo đến đơn vị 0.01mm cần dùng panme (micrometer)."},
{"id": 13, "cat_jp": "2. 工具・器具", "cat_vn": "Dụng cụ, đồ nghề", "type": "OX", "q_jp": "マイクロメータは、ノギスよりも精密な寸法測定ができる工具である。", "q_vn": "Panme (micrometer) là dụng cụ có thể đo kích thước chính xác hơn thước cặp.", "answer": "○", "exp_jp": "マイクロメータは一般に0.01mm程度、あるいはそれ以上の精度で測定できる。", "exp_vn": "Panme thường có thể đo với độ chính xác khoảng 0.01mm hoặc cao hơn."},

{"id": 49, "cat_jp": "6. 安全衛生", "cat_vn": "An toàn vệ sinh lao động", "type": "OX", "q_jp": "電動工具を使用する前には、コードや本体に損傷がないか点検する必要はない。", "q_vn": "Trước khi sử dụng dụng cụ điện, không cần kiểm tra xem dây điện hoặc thân máy có bị hỏng hay không.", "answer": "×", "exp_jp": "損傷があると感電や火災の原因となるため、使用前の点検は必須である。", "exp_vn": "Nếu có hư hỏng sẽ gây ra điện giật hoặc cháy nổ, nên việc kiểm tra trước khi sử dụng là bắt buộc."},
{"id": 50, "cat_jp": "6. 安全衛生", "cat_vn": "An toàn vệ sinh lao động", "type": "OX", "q_jp": "整理整頓（5S）は、作業の安全性向上にも役立つ活動である。", "q_vn": "Sắp xếp gọn gàng (5S) là hoạt động cũng giúp nâng cao tính an toàn trong công việc.", "answer": "○", "exp_jp": "通路や作業スペースを整理することで、つまずきや転倒などの事故を防止できる。", "exp_vn": "Nhờ việc sắp xếp lối đi và không gian làm việc, có thể phòng tránh các tai nạn như vấp ngã."}
];
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycby5HJ3XenN_K581UPxIc7vc39wBBhnge4ZMo7RKSEQbj2qXydnqqYV-LKokliVldCLz/exec";

const CATS = [...new Set(QUESTIONS.map(q=>q.cat_jp))];
const CAT_COLORS = ["#ff6fa5","#7b5cff","#4fc3f7","#33d17a","#ffb347","#ff5c5c","#22b8cf","#a366ff"];

const urlParams = new URLSearchParams(window.location.search);
const FIXED_COMPANY = urlParams.get("company") || "";

let state = {};

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function renderStart(){
  state = {pool:[], idx:0, score:0, streak:0, bestStreak:0, answered:false, catLabel:"", company:FIXED_COMPANY, name: state.name || ""};
  const card = document.getElementById("card");
  let catButtons = CATS.map((c,i)=>{
    const vn = QUESTIONS.find(q=>q.cat_jp===c).cat_vn;
    const color = CAT_COLORS[i % CAT_COLORS.length];
    return `<button class="cat-btn" style="background:${color}" data-cat="${c}">${c}<small>${vn}</small></button>`;
  }).join("");

  const companyField = FIXED_COMPANY
    ? `<div class="field-group"><label>会社名 / Công ty</label><div class="company-fixed">🏢 ${FIXED_COMPANY}</div></div>`
    : `<div class="field-group"><label>会社名 / Tên công ty</label><input id="companyInput" type="text" placeholder="例: 株式会社〇〇" value="${state.company||''}"></div>`;

  card.innerHTML = `
    <div class="start-screen">
      <h2>🎮 挑戦する分野を選ぼう！</h2>
      <p style="color:#6a5acd; font-style:italic; margin-top:-6px;">Chọn chủ đề bạn muốn thử thách!</p>
      <div class="badge-note">📋 全50問・すべて○×形式（実際の学科試験と同じ形式）／ 50 câu, toàn bộ dạng Đúng/Sai (giống hình thức đề thi thật)</div>
      ${companyField}
      <div class="field-group">
        <label>お名前 / Họ tên</label>
        <input id="nameInput" type="text" placeholder="例: グエン・バン・A" value="${state.name||''}">
      </div>
      <div class="hint" id="hintMsg"></div>
      <div class="cat-grid">
        <button class="cat-btn all" data-cat="ALL">🌟 全部まとめて挑戦！<small>Thử thách tất cả!</small></button>
        ${catButtons}
      </div>
    </div>
  `;
  card.querySelectorAll(".cat-btn").forEach(btn=>{
    btn.onclick = () => {
      const name = document.getElementById("nameInput").value.trim();
      const company = FIXED_COMPANY || (document.getElementById("companyInput") ? document.getElementById("companyInput").value.trim() : "");
      if(!name || !company){
        document.getElementById("hintMsg").textContent = "会社名とお名前を入力してください / Vui lòng nhập tên công ty và họ tên";
        return;
      }
      state.name = name;
      state.company = company;
      startQuiz(btn.dataset.cat);
    };
  });
}

function startQuiz(cat){
  const list = cat === "ALL" ? QUESTIONS : QUESTIONS.filter(q=>q.cat_jp===cat);
  state.pool = shuffle(list);
  state.idx = 0;
  state.score = 0;
  state.streak = 0;
  state.bestStreak = 0;
  state.catLabel = cat === "ALL" ? "全分野 / Tất cả chủ đề" : cat;
  renderQuestion();
}

function renderProgress(){
  const total = state.pool.length;
  const pct = Math.round((state.idx/total)*100);
  return `
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="score-pill">⭐ ${state.score} / ${total}</div>
    </div>
    <div class="streak">${state.streak>=2 ? "🔥 "+state.streak+" 連続正解！ Chuỗi đúng "+state.streak+" câu!" : ""}</div>
  `;
}

function renderQuestion(){
  const card = document.getElementById("card");
  const q = state.pool[state.idx];
  state.answered = false;

  let body = "";
  if(q.type === "OX"){
    body = `<div class="ox-row"><button class="ox-btn o" data-val="○">○</button><button class="ox-btn x" data-val="×">×</button></div>`;
  } else {
    const labels = ["A","B","C","D"];
    body = `<div class="choices">` + q.choices.map((c,i)=>`
      <button class="choice-btn" data-val="${c.jp.replace(/"/g,'&quot;')}">
        <span class="badge">${labels[i]}</span>
        <span class="txt"><span class="jp">${c.jp}</span><span class="vn">${c.vn}</span></span>
      </button>
    `).join("") + `</div>`;
  }

  card.innerHTML = `
    ${renderProgress()}
    <div class="cat-tag">${q.cat_jp}</div>
    <div class="question-jp">Q${state.idx+1}. ${q.q_jp}</div>
    <div class="question-vn">${q.q_vn}</div>
    ${body}
    <div id="feedback-area"></div>
  `;

  const btns = card.querySelectorAll(".ox-btn, .choice-btn");
  btns.forEach(b => b.onclick = () => handleAnswer(b, q, btns));
}

function handleAnswer(btn, q, allBtns){
  if(state.answered) return;
  state.answered = true;
  const chosen = btn.dataset.val;
  const isCorrect = chosen === q.answer;

  allBtns.forEach(b=>{
    b.disabled = true;
    if(b.dataset.val === q.answer) b.classList.add("correct");
    else if(b === btn) b.classList.add("wrong");
  });

  if(isCorrect){
    state.score++;
    state.streak++;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    launchConfetti();
  } else {
    state.streak = 0;
  }

  const fbBox = document.getElementById("feedback-area");
  const praises = ["すごい！🎉","やった！✨","正解だよ！👏","さすが！💪","ナイス！🌟"];
  const encourages = ["だいじょうぶ！次はできるよ😊","おしい！💡","気にしないで、続けよう！🙌","一緒に頑張ろう！🌈"];
  const title = isCorrect
    ? praises[Math.floor(Math.random()*praises.length)] + " 正解 / Chính xác!"
    : encourages[Math.floor(Math.random()*encourages.length)] + " 不正解 / Chưa đúng";

  fbBox.innerHTML = `
    <div class="feedback ${isCorrect?'correct':'wrong'}">
      <div class="fb-title">${title}</div>
      <div class="exp-jp">📘 ${q.exp_jp}</div>
      <div class="exp-vn">📗 ${q.exp_vn}</div>
    </div>
    <button class="next-btn" id="nextBtn">${state.idx+1 < state.pool.length ? "次の問題へ ▶ Câu tiếp theo" : "結果を見る 🏆 Xem kết quả"}</button>
  `;
  document.getElementById("nextBtn").onclick = () => {
    state.idx++;
    if(state.idx < state.pool.length) renderQuestion();
    else renderResult();
  };
}

function sendResult(total, pct){
  if(!WEBAPP_URL || WEBAPP_URL.indexOf("http") !== 0) return Promise.resolve(false);
  const payload = {
    "会社名": state.company || "",
    "名前": state.name || "",
    "分野": state.catLabel || "",
    "正解数": String(state.score),
    "問題数": String(total),
    "正答率": String(pct)
  };
  return fetch(WEBAPP_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify(payload)
  }).then(()=>true).catch(()=>false);
}

function renderResult(){
  const total = state.pool.length;
  const pct = Math.round((state.score/total)*100);
  let emoji, msgJp, msgVn, stars;
  if(pct === 100){
    emoji="🏆👑"; msgJp="満点！すばらしい！本当の合格レベルです！"; msgVn="Điểm tuyệt đối! Tuyệt vời! Bạn đã đạt trình độ đậu thật sự!"; stars="★★★★★";
  } else if(pct >= 80){
    emoji="🎉🌟"; msgJp="とてもよくできました！この調子で頑張ろう！"; msgVn="Làm rất tốt! Hãy tiếp tục cố gắng như vậy!"; stars="★★★★☆";
  } else if(pct >= 60){
    emoji="😊👍"; msgJp="いい感じ！もう少し復習すればバッチリ！"; msgVn="Khá tốt! Ôn thêm một chút nữa là hoàn hảo!"; stars="★★★☆☆";
  } else if(pct >= 40){
    emoji="💪🙂"; msgJp="よく挑戦したね！もう一度やってみよう！"; msgVn="Bạn đã cố gắng rồi! Hãy thử lại lần nữa nhé!"; stars="★★☆☆☆";
  } else {
    emoji="🌱😉"; msgJp="だいじょうぶ！練習すればきっとできる！"; msgVn="Không sao cả! Luyện tập nhiều sẽ làm được thôi!"; stars="★☆☆☆☆";
  }

  const card = document.getElementById("card");
  card.innerHTML = `
    <div class="result-screen">
      <div class="cat-tag">${state.company} ／ ${state.name}</div>
      <div class="cat-tag" style="background:var(--purple)">${state.catLabel}</div>
      <div class="result-emoji">${emoji}</div>
      <div class="result-score">${state.score} / ${total} 問正解 (${pct}%)</div>
      <div class="stars">${stars}</div>
      <div class="result-msg">${msgJp}</div>
      <div class="result-msg-vn">${msgVn}</div>
      <div style="margin-top:6px; color:#e85d04; font-weight:bold;">🔥 最高連続正解 / Chuỗi đúng liên tiếp cao nhất: ${state.bestStreak}</div>
      <div class="save-status" id="saveStatus">📤 成績を保存しています… / Đang lưu kết quả…</div>
      <div class="retry-btns">
        <button class="again" id="retryBtn">🔁 もう一度 / Làm lại</button>
        <button class="home" id="homeBtn">🏠 分野選択に戻る / Về chọn chủ đề</button>
      </div>
    </div>
  `;
  document.getElementById("retryBtn").onclick = () => {
    const cat = state.catLabel.startsWith("全分野") ? "ALL" : state.catLabel;
    startQuiz(cat);
  };
  document.getElementById("homeBtn").onclick = renderStart;

  sendResult(total, pct).then(ok=>{
    const el = document.getElementById("saveStatus");
    if(!el) return;
    el.textContent = "✅ 成績を保存しました / Đã lưu kết quả thành công";
    el.classList.add("ok");
  });

  if(pct >= 60) launchConfetti(30);
}

function launchConfetti(n){
  n = n || 8;
  const emojis = ["🎉","✨","⭐","🎊","💫"];
  for(let i=0;i<n;i++){
    const el = document.createElement("div");
    el.className = "confetti";
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left = Math.random()*100 + "vw";
    el.style.animationDuration = (2 + Math.random()*1.5) + "s";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 4000);
  }
}

renderStart();
</script>
</body>
</html>
